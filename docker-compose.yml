services:
  postgres:
    image: postgres:16-alpine
    container_name: broccoli-pg
    environment:
      POSTGRES_USER: broccoli
      POSTGRES_PASSWORD: broccoli
      POSTGRES_DB: broccoli
    ports:
      - "5432:5432"
    volumes:
      - broccoli-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broccoli"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  broccoli-pgdata:
