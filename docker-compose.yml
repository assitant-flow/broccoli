services:
  postgres:
    image: postgres:16-alpine
    container_name: broccoli-pg
    environment:
      POSTGRES_USER: broccoli
      POSTGRES_PASSWORD: broccoli
      POSTGRES_DB: broccoli
    ports:
      - "5432:5432"
    volumes:
      - broccoli-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broccoli"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: broccoli-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://broccoli:broccoli@postgres:5432/broccoli
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      BROCCOLI_MASTER_KEY: ${BROCCOLI_MASTER_KEY:-dev-master-key-change-me-32bytes!!}
      BROCCOLI_MAX_CONCURRENCY: ${BROCCOLI_MAX_CONCURRENCY:-2}
      BROCCOLI_SNAPSHOT_TTL_HOURS: ${BROCCOLI_SNAPSHOT_TTL_HOURS:-24}
      BROCCOLI_ENGINE: ${BROCCOLI_ENGINE:-mock}
      BROCCOLI_DATA_DIR: /app/.data
      BROCCOLI_SITE_URL: ${BROCCOLI_SITE_URL:-http://localhost:3000}
      # 本地模式（开发/自用）：保持宽松默认；公网请用 docker-compose.prod.yml
      BROCCOLI_MODE: local
      BROCCOLI_SEED_DEMO: ${BROCCOLI_SEED_DEMO:-1}
      BROCCOLI_REGISTRATION: ${BROCCOLI_REGISTRATION:-open}
      BROCCOLI_SHARED_CREDENTIALS: ${BROCCOLI_SHARED_CREDENTIALS:-1}
      # LLM router 在宿主机时，容器内需用 host.docker.internal 访问
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-http://host.docker.internal:1980}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
      # AI 项目交付阶段启动的服务（services.ts 从 3930 起分配端口）
      - "3930-3990:3930-3990"
    volumes:
      - broccoli-data:/app/.data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5

volumes:
  broccoli-pgdata:
  broccoli-data:
