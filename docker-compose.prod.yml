# 公网部署编排（与本地 docker-compose.yml 分离，避免误用开发默认值）
# 用法（仓库根目录，已准备 .env.production）：
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# 仅 Caddy 对外暴露 80/443；应用与数据库只在内网可达，不发布端口。

x-logging: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: broccoli
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: broccoli
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broccoli -d broccoli"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    logging: *log

  app:
    build: .
    restart: unless-stopped
    # 非 root 运行（uid 1000 即镜像内 node 用户）；数据卷属主已在镜像内预设
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BROCCOLI_MODE: public
      DATABASE_URL: postgres://broccoli:${POSTGRES_PASSWORD}@postgres:5432/broccoli
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env.production 设置 SESSION_SECRET}
      BROCCOLI_MASTER_KEY: ${BROCCOLI_MASTER_KEY:?请在 .env.production 设置 BROCCOLI_MASTER_KEY}
      BROCCOLI_SITE_URL: ${BROCCOLI_SITE_URL:?请在 .env.production 设置 BROCCOLI_SITE_URL}
      BROCCOLI_INSECURE_HTTP: ${BROCCOLI_INSECURE_HTTP:-}
      BROCCOLI_DATA_DIR: /app/.data
      BROCCOLI_ENGINE: ${BROCCOLI_ENGINE:-claude}
      BROCCOLI_SANDBOX: ${BROCCOLI_SANDBOX:-local}
      BROCCOLI_ACK_LOCAL_SANDBOX: ${BROCCOLI_ACK_LOCAL_SANDBOX:-0}
      BROCCOLI_REGISTRATION: ${BROCCOLI_REGISTRATION:-closed}
      # 公网固定关闭：演示账号与平台共享 Token（费用与权限不外溢给访客）
      BROCCOLI_SEED_DEMO: "0"
      BROCCOLI_SHARED_CREDENTIALS: "0"
      BROCCOLI_MAX_CONCURRENCY: ${BROCCOLI_MAX_CONCURRENCY:-2}
      BROCCOLI_SNAPSHOT_TTL_HOURS: ${BROCCOLI_SNAPSHOT_TTL_HOURS:-24}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
    volumes:
      - appdata:/app/.data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    mem_limit: 2g
    logging: *log

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      BROCCOLI_DOMAIN: ${BROCCOLI_DOMAIN:?请在 .env.production 设置 BROCCOLI_DOMAIN}
    ports:
      - "${BROCCOLI_HTTP_PORT:-80}:80"
      - "${BROCCOLI_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    mem_limit: 256m
    logging: *log

volumes:
  pgdata:
  appdata:
  caddydata:
  caddyconfig:
